html.oscuro{--fondo:#051F20;--sup:#0B2B26;--campo:#0F3530;--borde:#1F4A41;--bctl:#5E8E73;--txt:#E3F2E7;--suave:#9DC2AA;--acento:#8EB69B;--menta:#163832;--error:#F97066;--errorF:#3B1512;--aviso:#FDB022;--avisoF:#3A2A12;--ok:#7FD1A4;--okF:#123B2E;--btnF:#2F6B5A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--txt);font-family:"Century Gothic",Questrial,"Avenir Next",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Akshar,"Arial Narrow",sans-serif;margin:0}
h1{font-size:32px;line-height:34px;font-weight:700}h2{font-size:24px;line-height:28px;font-weight:600}h3{font-size:18px;line-height:22px;font-weight:600}
p{margin:0}.suave{color:var(--suave)}.chico{font-size:12px}.c13{font-size:13px}.oculto{display:none!important}
button{font-family:inherit}
.btn{height:48px;border:0;border-radius:10px;background:var(--btnF);color:#fff;font-size:15px;font-weight:600;cursor:pointer;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.w{width:100%}.btn:disabled{opacity:.55;cursor:default}
.btn2{height:42px;border:1.5px solid var(--bctl);border-radius:10px;background:transparent;color:var(--acento);font-size:14px;cursor:pointer;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.link{border:0;background:transparent;color:var(--acento);font-size:14px;cursor:pointer;padding:6px}
input,select{width:100%;height:50px;border:1.5px solid var(--bctl);border-radius:8px;background:var(--campo);padding:0 14px;font-size:17px;color:var(--txt);font-family:inherit}
input.grande{font-family:Akshar,sans-serif;font-size:22px;letter-spacing:1px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
label.l{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
.pila{display:flex;flex-direction:column;gap:14px}
.card{background:var(--sup);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(5,31,32,.08);border:1px solid var(--borde)}
.aviso{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:19px}
.aviso.err{background:var(--errorF);color:var(--error)}.aviso.ok{background:var(--okF);color:var(--ok)}.aviso.warn{background:var(--avisoF);color:var(--aviso)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okF);color:var(--ok)}.b-proc{background:var(--avisoF);color:var(--aviso)}.b-pend{background:var(--errorF);color:var(--error)}.b-mut{background:var(--menta);color:var(--suave)}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){#login{grid-template-columns:minmax(380px,520px) 1fr}}
.lform{padding:28px 22px 40px;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:520px;width:100%;margin:0 auto}
.lform .logo{height:30px;align-self:flex-start}
.lhero{display:none;position:relative;background:#0B2B26 center/cover no-repeat}
@media(min-width:900px){.lhero{display:block}}
.lhero::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(5,31,32,.15),rgba(5,31,32,.75))}
.lhero .tx{position:absolute;left:40px;right:40px;bottom:46px;z-index:1;color:#fff}
.lhero .tx h2{font-size:34px;line-height:38px}
.lhero .tx p{color:#DAF1DE;margin-top:8px;font-size:15px;max-width:520px}
.ojo{position:relative}.ojo button{position:absolute;right:6px;top:6px;height:38px;border:0;background:transparent;color:var(--suave);cursor:pointer;padding:0 8px}

/* ---------- APP ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--sup);border-bottom:1px solid var(--borde)}
.topin{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.topin .logo{height:24px}
.topin .who{margin-left:auto;text-align:right;line-height:1.25;min-width:0}
.topin .who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.topin .who span{font-size:11.5px;color:var(--suave)}
.icb{width:38px;height:38px;border-radius:10px;border:1px solid var(--borde);background:var(--campo);color:var(--txt);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.tabs{max-width:1080px;margin:0 auto;display:flex;gap:4px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;color:var(--suave);font-size:14px;padding:10px 12px 12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:6px}
.tabs button.on{color:var(--txt);font-weight:700;border-bottom-color:var(--acento)}
main{max-width:1080px;margin:0 auto;padding:18px 16px 110px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.kpi .l{font-size:12px;color:var(--suave);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kpi .n{font-family:Akshar,sans-serif;font-size:24px;font-weight:700;line-height:26px}
.kpi .s{font-size:12.5px;color:var(--suave);margin-top:4px}
.acc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.acc a,.acc button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:14px;color:var(--txt);text-decoration:none;cursor:pointer;text-align:left;font-size:14px;font-weight:600}
.acc .ic{width:38px;height:38px;border-radius:10px;background:var(--menta);color:var(--acento);display:flex;align-items:center;justify-content:center}
.acc small{font-weight:400;color:var(--suave);font-size:12px}
/* Cuentas regresivas */
.cd{border-radius:18px;padding:14px;text-align:center;color:#FFEDD5;background:linear-gradient(160deg,#7A2E0B,#C2410C)}
.cd.bal{background:linear-gradient(160deg,#0B2B26,#235347);color:#DAF1DE}
.cd .t{font-size:12.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:#FFF3C4;margin-bottom:8px}
.cd.bal .t{color:#FFE08A}
.cd .r{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cd .r div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column}
.cd .r b{font-family:Akshar,sans-serif;font-size:30px;line-height:32px;color:#fff}.cd .r span{font-size:10px;text-transform:uppercase;opacity:.85}
.cd .f{font-size:12.5px;margin-top:8px;color:#fff;line-height:17px}
.cd .btn{margin-top:10px;height:40px;background:rgba(255,255,255,.95);color:#7A2E0B;font-size:14px}
.cd.bal .btn{color:#0B2B26}
/* Publicidad */
.promo{position:relative;border-radius:18px;overflow:hidden;min-height:170px;background:#0B2B26 center/cover no-repeat;display:flex;align-items:flex-end}
.promo::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,31,32,.92),rgba(5,31,32,.35))}
.promo .tx{position:relative;padding:18px;color:#fff;max-width:520px}
.promo .tx b{font-family:Akshar,sans-serif;font-size:22px;line-height:24px;display:block}
.promo .tx p{color:#DAF1DE;font-size:13.5px;margin:6px 0 10px;line-height:18px}
.promo .tx a{display:inline-flex;height:36px;align-items:center;padding:0 14px;border-radius:9px;background:#8EB69B;color:#051F20;font-weight:700;font-size:13.5px;text-decoration:none}
.puntos{display:flex;gap:6px;justify-content:center;margin-top:8px}.puntos i{width:7px;height:7px;border-radius:50%;background:var(--borde)}.puntos i.on{background:var(--acento)}
/* Tablas */
.tw{overflow:auto;border-radius:12px;border:1px solid var(--borde);max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--campo);text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--suave);padding:9px 10px;white-space:nowrap;z-index:1}
td{padding:10px;border-top:1px solid var(--borde);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lista .it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--borde)}
.lista .it:first-child{border-top:0}
.lista .it .ic{width:38px;height:38px;border-radius:10px;background:var(--menta);color:var(--acento);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lista .it .tx{flex:1;min-width:0}.lista .it .tx b{display:block;font-size:14.5px}.lista .it .tx span{font-size:12.5px;color:var(--suave)}
.dato{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--borde);font-size:14px}.dato:first-child{border-top:0}
.dato span{color:var(--suave)}.dato b{text-align:right;word-break:break-word}
.visor{position:fixed;inset:0;z-index:90;background:#051F20;display:flex;flex-direction:column}
.visor .vhd{display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(90deg,#0B2B26,#235347);color:#fff;border-bottom:3px solid #8EB69B}
.visor .vhd b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.visor .vcu{flex:1;overflow:auto;background:#E9F1EC;padding:10px}
.mini{height:32px;border:1px solid var(--borde);border-radius:8px;background:var(--campo);color:var(--txt);font-size:12.5px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.subir{border:2px dashed var(--bctl);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
/* Flotantes */
.flot{position:fixed;right:16px;bottom:18px;z-index:40;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.flot button,.flot a{height:52px;border-radius:26px;border:0;display:inline-flex;align-items:center;gap:8px;padding:0 18px 0 14px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 6px 18px rgba(5,31,32,.25)}
.flot .wa{background:#163832;color:#DAF1DE;border:1.5px solid #8EB69B}.flot .ia{background:var(--btnF);color:#fff}
@media(max-width:520px){.flot button span,.flot a span{display:none}.flot button,.flot a{width:52px;padding:0;justify-content:center}}
/* Chat */
.chat{position:fixed;right:16px;bottom:16px;z-index:60;width:min(400px,calc(100vw - 24px));height:min(560px,calc(100vh - 90px));background:var(--sup);border:1px solid var(--borde);border-radius:18px;box-shadow:0 20px 50px rgba(5,31,32,.35);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:520px){.chat{right:12px;left:12px;width:auto;bottom:12px}}
.chat .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(160deg,#0B2B26,#235347);color:#fff}
.chat .hd img{width:28px;height:28px}.chat .hd b{flex:1}.chat .hd button{background:transparent;border:0;color:#fff;cursor:pointer}
.chat .ms{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.chat .m{overflow-wrap:anywhere;max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:19px;white-space:pre-wrap}
.chat .m.yo{align-self:flex-end;background:var(--btnF);color:#fff;border-bottom-right-radius:4px}
.chat .m.ia{align-self:flex-start;background:var(--campo);border-bottom-left-radius:4px}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--borde)}
.chat form input{height:44px;font-size:15px}.chat form button{height:44px;width:48px;padding:0;flex-shrink:0}
.sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}.sug button{border:1px solid var(--borde);background:var(--campo);color:var(--txt);border-radius:16px;padding:6px 10px;font-size:12.5px;cursor:pointer}
/* Animación de marca */
.animFull{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 35%,#235347,#051F20 70%)}
.animFull .animN{background:transparent;margin:0;max-width:460px;width:100%;padding:0}
.animFull .animN .anC{width:150px;height:150px}.animFull .animN .anLogo{inset:35px;width:80px;height:80px}
.animFull .animN b{font-size:22px;font-family:Akshar,sans-serif;letter-spacing:.3px}.animFull .animN span{font-size:15px;color:#B7D9C0}
.animFull::before{content:"";position:absolute;top:28px;left:50%;transform:translateX(-50%);width:170px;height:28px;background:url(marca/logos/nummeros-logotipo-horizontal-blanco.svg) center/contain no-repeat;opacity:.9}
.animN{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 16px 20px;border-radius:20px;background:linear-gradient(160deg,#0B2B26,#235347);color:#DAF1DE;max-width:420px;margin:40px auto}
.animN .anC{position:relative;width:104px;height:104px;margin-bottom:6px}
.animN .anArc{position:absolute;inset:0;width:100%;height:100%;animation:anGiro 1.1s linear infinite}
.animN .anArc circle{fill:none;stroke:#8EB69B;stroke-width:6;stroke-linecap:round;stroke-dasharray:90 250}
.animN .anLogo{position:absolute;inset:24px;width:56px;height:56px;animation:anLat 1.4s ease-in-out infinite}
.animN b{font-size:17px;color:#fff}.animN span{font-size:13.5px}
.animN .anBar{display:block;width:80%;height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
.animN .anBar i{display:block;height:100%;width:0;background:#8EB69B;border-radius:9px;animation:anLlena 3s ease-out forwards}
@keyframes anGiro{to{transform:rotate(360deg)}}@keyframes anLat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes anLlena{to{width:100%}}
@media(prefers-reduced-motion:reduce){.animN .anArc,.animN .anLogo{animation:none}}
.logoOsc{display:none}html.oscuro .logoClaro{display:none}html.oscuro .logoOsc{display:block}
</style>

    bg.querySelector(".icb").onclick = function () { bg.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 2000); };
  }
  function pedirPdf(btn, datos) {
    btn.disabled = true; var o = btn.innerHTML; btn.textContent = "Preparando…";
    apiS(datos).then(function (r) { btn.disabled = false; btn.innerHTML = o; if (!r.ok) { alert(r.error || "No se pudo generar."); return; } abrirVisor(r); });
  }
  function enlazarPdf(raizEl) {
    (raizEl || document).querySelectorAll("[data-pdf]").forEach(function (b) { b.onclick = function () { var p = b.dataset.pdf.split("|"); pedirPdf(b, { action: "portal_pdf", tipo: p[0], id: p[1] || "", anio: p[2] || "" }); }; });
  }

  // ----- Mis datos -----
  function tabDatos(d) {
    var c = d.cliente, f = function (a) { return a ? String(a).split("-").reverse().join("/") : ""; };
    var dato = function (l, v) { return '<div class="dato"><span>' + esc(l) + "</span><b>" + esc(v || "—") + "</b></div>"; };
    return '<div class="pila"><h2>Mis datos</h2><div class="grid">' +
      '<div class="card"><h3 style="margin-bottom:6px">Datos personales</h3>' + dato("Nombre o razón social", c.nombre) + dato("NIT", c.nit) + dato("Código de cliente", c.id) + dato("Celular", c.celular) + dato("Correo", c.correo) + "</div>" +
      '<div class="card"><h3 style="margin-bottom:6px">Actividad</h3>' + dato("Tipo de contribuyente", c.tipo) + dato("Actividad principal", c.actividad) + dato("Brinda servicios a", c.brinda) + dato("Apertura del NIT", f(c.aperturaNit)) + dato("Matrícula SEPREC", c.matricula) + dato("Vencimiento mensual", "Día " + c.diaVence) + "</div></div>" +
      '<div class="aviso warn">¿Algún dato está mal o cambió? <a href="' + wa("Hola CONTAX, quiero actualizar mis datos. Mi NIT es " + c.nit + ".") + '" target="_blank" rel="noopener" style="color:inherit;font-weight:700">Avísanos por WhatsApp</a> y lo corregimos.</div></div>';
  }

  // ================= ASISTENTE =================
  function pintarChat() {
    var box = document.getElementById("chatBox"); if (!box) return;
    if (!S.chatAbierto) { box.innerHTML = ""; return; }
    if (!S.chat.length) S.chat.push({ de: "ia", t: "Hola, " + primerNombre(S.d.cliente.nombre) + ". Soy el asistente de CONTAX. Puedo ayudarte con tus declaraciones, vencimientos, precios y pagos. ¿Qué necesitas?" });
    box.innerHTML = '<div class="chat" role="dialog" aria-label="Asistente de CONTAX"><div class="hd"><img src="marca/logos/nummeros-isotipo-blanco.svg" alt=""><b>Asistente CONTAX</b><button id="cX" aria-label="Cerrar">' + ic("x", 20) + "</button></div>" +
      '<div class="ms" id="cMs">' + S.chat.map(function (m) { return '<div class="m ' + (m.de === "yo" ? "yo" : "ia") + '">' + esc(m.t) + "</div>"; }).join("") + (S.pensando ? '<div class="m ia">Escribiendo…</div>' : "") + "</div>" +
      (S.chat.length < 2 ? '<div class="sug">' + ["¿Cuándo vence mi declaración?", "¿Cuánto cuesta el balance?", "¿Cómo pago con QR?"].map(function (q) { return '<button data-q="' + esc(q) + '">' + esc(q) + "</button>"; }).join("") + "</div>" : "") +
      '<form id="cF"><input id="cIn" placeholder="Escribe tu pregunta…" autocomplete="off" maxlength="500"><button class="btn" aria-label="Enviar">' + ic("enviar") + "</button></form></div>";
    var ms = document.getElementById("cMs"); ms.scrollTop = ms.scrollHeight;
    document.getElementById("cX").onclick = function () { S.chatAbierto = false; pintarChat(); };
    var enviar = function (t) {
      t = String(t || "").trim(); if (!t || S.pensando) return;
      var hist = S.chat.slice(1); S.chat.push({ de: "yo", t: t }); S.pensando = true; pintarChat();
      apiS({ action: "portal_chat", mensaje: t, historial: hist }).then(function (r) {
        S.pensando = false; S.chat.push({ de: "ia", t: r.ok ? r.respuesta : (r.error || "No pude responder ahora.") }); pintarChat();
      });
    };
    document.getElementById("cF").onsubmit = function (e) { e.preventDefault(); enviar(document.getElementById("cIn").value); };
    box.querySelectorAll("[data-q]").forEach(function (b) { b.onclick = function () { enviar(b.dataset.q); }; });
    var inp = document.getElementById("cIn"); if (inp && !S.pensando) inp.focus();
  }

  // ================= INICIO =================
  var tk = ""; try { tk = sessionStorage.getItem("portal-tk") || ""; } catch (e) {}
  try { var mh = location.hash.match(/tk=([A-Za-z0-9-]+)/); if (mh) { tk = mh[1]; sessionStorage.setItem("portal-tk", tk); history.replaceState(null, "", location.pathname); } } catch (e) {}
  var nitGuardado = ""; try { nitGuardado = localStorage.getItem("portal-nit") || ""; } catch (e) {}
  api({ action: "pas_config" }).then(function (r) { if (r && r.ok) { S.cfgPub = { precios: r.precios, lanzamiento: r.lanzamiento, eeffGestion: r.eeff && r.eeff.gestion, diaDesde: r.diaDesde || 25 }; if (!S.d && document.getElementById("fLog")) { var n = document.getElementById("lNit"), ci = document.getElementById("lCi"); if (!ci || !ci.value) pintarLogin("", n ? n.value : nitGuardado); } } });
  if (tk) {
    raiz.innerHTML = anim("Abriendo tu portal", "Un momento…");
    S.token = tk;
    apiS({ action: "portal_datos" }).then(function (r) { if (r.ok) { S.d = r; pintarApp(); } else if (r.sesion !== false) pintarLogin(r.error, nitGuardado); });
  } else pintarLogin("", nitGuardado);
})();
</script>
</body>
</html>
