<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagos CONTAX · NUMMEROS</title>
<meta name="description" content="Paga tu servicio de CONTAX con QR y recibe tu Orden de Recepción al instante.">
<link rel="icon" href="marca/iconos/favicon.ico">
<link rel="apple-touch-icon" href="marca/iconos/icono-app-principal-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Akshar:wght@400;600;700&family=Questrial&display=swap">
<style>
:root{--fondo:#F4FAF5;--sup:#FFFFFF;--campo:#EEF7F0;--borde:#DAF1DE;--bctl:#6F9A7D;--txt:#163832;--suave:#557363;--acento:#235347;--menta:#DAF1DE;--error:#B42318;--aviso:#93370D;--avisoF:#FEF0E7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--txt);font-family:"Century Gothic",Questrial,"Avenir Next",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--sup);border-bottom:1px solid var(--borde)}
header img{height:22px;display:block}
.seg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--suave)}
.barras{display:flex;gap:4px;padding:12px 20px 0}.barras i{flex:1;height:4px;border-radius:4px;background:var(--borde)}.barras i.on{background:var(--acento)}
main{flex:1;padding:20px}
h1{margin:0;font-family:Akshar,"Arial Narrow",sans-serif;font-size:34px;line-height:36px;font-weight:700}
h2{margin:0 0 4px;font-family:Akshar,"Arial Narrow",sans-serif;font-size:28px;line-height:32px;font-weight:600}
p{margin:0}.suave{color:var(--suave)}.chico{font-size:12px}.c13{font-size:13px}
.pila{display:flex;flex-direction:column;gap:14px}
.card{background:var(--sup);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px rgba(5,31,32,.08)}
.fila{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}.fila span:first-child{color:var(--suave)}.fila b{text-align:right}
label.l{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
input.nit,select{width:100%;height:50px;border:1.5px solid var(--bctl);border-radius:6px;background:var(--campo);padding:0 14px;font-size:18px;color:var(--txt);font-family:inherit}
input.nit{font-family:Akshar,sans-serif;font-size:22px;letter-spacing:1px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.btn{height:50px;border:0;border-radius:10px;background:var(--acento);color:#fff;font-size:16px;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
.btn:disabled{opacity:.55;cursor:default}
.btn2{height:44px;border:1.5px solid var(--bctl);border-radius:10px;background:transparent;color:var(--acento);font-size:14px;cursor:pointer;width:100%;font-family:inherit}
.link{height:40px;border:0;background:transparent;color:var(--acento);font-size:14px;cursor:pointer;font-family:inherit}
.opc{text-align:left;border:2px solid var(--borde);border-radius:14px;background:var(--sup);padding:16px;cursor:pointer;display:flex;gap:14px;align-items:center;color:var(--txt);width:100%;font-family:inherit}
.opc.sel{border-color:var(--acento)}
.opc .ic{width:44px;height:44px;border-radius:10px;background:var(--menta);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opc .t{flex:1}.opc .t b{display:block;font-size:16px}.opc .t span{font-size:13px;color:var(--suave)}
.precio{font-family:Akshar,sans-serif;font-size:22px;font-weight:700;white-space:nowrap}
.aviso{border-radius:12px;padding:12px 14px;font-size:13px;line-height:19px}
.aviso.ok{background:var(--menta)}.aviso.warn{background:var(--avisoF);color:var(--aviso)}.aviso.err{background:#FDECEA;color:var(--error)}
.qr{width:240px;max-width:100%;aspect-ratio:1;border-radius:12px;border:1px solid var(--borde);background:#fff;object-fit:contain;display:block;margin:0 auto}
.monto{font-family:Akshar,sans-serif;font-size:40px;font-weight:700;line-height:40px;text-align:center}
.paso{display:flex;gap:10px;font-size:13px;align-items:flex-start}.paso b{width:22px;height:22px;border-radius:999px;background:var(--acento);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.subir{height:56px;border:2px dashed var(--acento);border-radius:12px;background:var(--menta);color:var(--txt);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:inherit}
.prev{max-height:220px;max-width:100%;border-radius:10px;border:1px solid var(--borde);display:block;margin:0 auto}
.chk{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--borde);font-size:14px}.chk:last-child{border-bottom:0}
.chk .d{width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk .d.ok{background:var(--acento)}.chk .d.no{background:var(--error)}
.chk .v{flex:1}.chk .v span{display:block;font-size:12px;color:var(--suave)}.chk .n{font-size:12px;font-weight:700}
.cupo{border:2px solid var(--borde);border-radius:14px;background:var(--sup);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.cupo.act{border-color:var(--acento)}.cupo.lleno{background:var(--fondo)}
.barra{height:6px;border-radius:6px;background:var(--borde);overflow:hidden}.barra i{display:block;height:6px;background:var(--acento)}
.check{width:84px;height:84px;border-radius:999px;background:var(--acento);display:flex;align-items:center;justify-content:center;margin:0 auto}
.check.rev{background:var(--aviso)}
.spin{width:28px;height:28px;border:3px solid var(--borde);border-top-color:var(--acento);border-radius:50%;animation:g 0.9s linear infinite;margin:0 auto}@keyframes g{to{transform:rotate(360deg)}}
.hero{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:16/10;background:#0B2B26}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero span{position:absolute;left:12px;bottom:10px;background:rgba(5,31,32,.72);color:#DAF1DE;font-size:11px;padding:4px 9px;border-radius:999px}
details.info{background:var(--sup);border:1px solid var(--borde);border-radius:12px;padding:0 14px}
details.info summary{cursor:pointer;padding:12px 0;font-size:14px;font-weight:600;color:var(--acento);list-style:none;display:flex;justify-content:space-between}
details.info summary::after{content:"+";font-size:18px;line-height:1}details.info[open] summary::after{content:"–"}
details.info .c{padding:0 0 14px;font-size:13px;line-height:20px;color:var(--txt)}
details.info ul{margin:6px 0;padding-left:18px}details.info li{margin:3px 0}
.etq{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--menta);color:var(--acento);margin-left:6px;vertical-align:middle}
.tipos{display:flex;gap:8px;flex-wrap:wrap}.tipos button{flex:1;min-width:96px;height:44px;border:2px solid var(--borde);border-radius:10px;background:var(--sup);color:var(--txt);font-size:14px;cursor:pointer;font-family:inherit}.tipos button.sel{border-color:var(--acento);background:var(--menta);font-weight:600}
footer{padding:12px 20px 18px;text-align:center;font-size:11px;color:var(--suave)}
.oculto{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="marca/logos/nummeros-logotipo-horizontal-principal.svg" alt="NUMMEROS">
    <div class="seg"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#235347" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Pago seguro</div>
  </header>
  <div class="barras" id="barras" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <main id="main" aria-live="polite"></main>
  <footer>NUMMEROS by CONTAX · Santa Cruz - Bolivia</footer>
</div>
<script src="pagos-config.js"></script>
<script>
(function () {
  "use strict";
  var URL_ = window.PASARELA_URL || "", WA = window.PASARELA_WHATSAPP || "";
  var S = { paso: "nit", nit: "", cli: null, cfg: null, serv: "", opcion: "", plan: "", tipoFact: "", per: null, cot: null, img: "", ver: null, fin: null, cargando: false, error: "" };
  var main = document.getElementById("main");
  var ICON = {
    decl: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#235347" stroke-width="1.6" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h4"/></svg>',
    eeff: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#235347" stroke-width="1.6" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    fact: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#235347" stroke-width="1.6" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>',
    ok: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
    no: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    big: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
    reloj: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    subir: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#163832" stroke-width="1.8" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>'
  };
  // Descripciones tomadas del Manual CONTAX
  var INFO = {
    decl: '<p>Cada mes hacemos tu declaración ante Impuestos Nacionales: consolidamos tu <b>RCV</b> (Registro de Compras y Ventas) y presentamos los <b>Formularios 200 (IVA)</b> y <b>400 (IT)</b>.</p>' +
      '<ul><li>Si tienes facturas manuales, déjalas en nuestro <b>buzón (Av. Alemana, 7mo anillo)</b>, disponible a toda hora. Las electrónicas no hace falta.</li>' +
      '<li>Al terminar, te enviamos por WhatsApp los formularios en PDF, el QR de pago de impuestos (si corresponde) y un resumen de tus compras y ventas.</li>' +
      '<li>Cada pago cubre <b>un mes</b>. Si debes meses atrasados, se paga cada uno.</li></ul>' +
      '<p><b>Fechas:</b> recibimos del <b>25 al 30</b> (precio normal) y del <b>1 al 5</b> (recepción tardía). Presentamos antes de tu vencimiento, que depende del último dígito de tu NIT (del día 13 al 22).</p>' +
      '<p class="suave">No declarar a tiempo genera multas: RCV 100 UFV, Formulario 200 50 UFV y Formulario 400 50 UFV, que se acumulan cada mes.</p>',
    planes: '<ul><li><b>Básico · Bs 30:</b> sin movimiento. No se ingresan facturas; consolidamos el RCV tal como está y presentamos los formularios.</li>' +
      '<li><b>Estándar · Bs 50 / 60:</b> con movimiento, hasta <b>100 facturas</b> de compras y ventas al mes. Tarifa preferencial para repartidores de cualquier flota de delivery: Bs 50 pagando del 25 al 30, Bs 60 del 1 al 5.</li>' +
      '<li><b>Premium · Bs 95:</b> de <b>101 a 200 facturas</b> al mes, o empresas unipersonales que no son repartidores.</li>' +
      '<li><b>Personalizado · desde Bs 250:</b> más de 200 facturas al mes. Escríbenos por WhatsApp.</li></ul>',
    eeff: '<p>Una vez al año presentamos tus estados financieros de la gestión. Elaboramos:</p>' +
      '<ul><li>Balance general</li><li>Estado de resultados</li><li>Flujo de efectivo</li><li>Evolución del patrimonio</li><li>Notas a los estados financieros</li><li>Cuadro de activos fijos</li><li>Balance de sumas y saldos</li></ul>' +
      '<p>Luego presentamos el <b>Formulario 500 (IUE, 25% de las utilidades)</b> y enviamos los estados financieros en digital con el <b>Formulario 605</b>. Con eso queda culminado y sin multa.</p>' +
      '<p>Todo NIT abierto durante la gestión debe presentarlos, aunque se haya abierto el último día del año.</p>' +
      '<p class="suave">Si no se presentan a tiempo, la multa es de 150 UFV (Formulario 500: 50 UFV y Formulario 605: 100 UFV). Pagando temprano aprovechas el precio más bajo: los cupos suben de precio a medida que se llenan.</p>',
    fact: '<p>Durante todo el mes emitimos por ti tus facturas pendientes:</p>' +
      '<ul><li><b>Repartidores de Yango:</b> una factura cada semana con el importe autorizado. Cada martes actualizamos tu portal NUMMEROS y la dejamos lista antes del jueves, para que cobres sin demoras.</li>' +
      '<li><b>Repartidores de PedidosYa:</b> aproximadamente dos facturas al mes.</li>' +
      '<li><b>Otros clientes:</b> si necesitas emitir una factura a uno de tus clientes, la emitimos nosotros.</li></ul>' +
      '<p class="suave">Si la app no autoriza tu pago de la semana (por ejemplo, por no cumplir el mínimo de horas), no se emite factura esa semana.</p>'
  };
  function info(titulo, html, abierto) { return '<details class="info"' + (abierto ? " open" : "") + "><summary>" + titulo + '</summary><div class="c">' + html + "</div></details>"; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function bs(n) { return "Bs " + (Number(n) || 0).toLocaleString("es-BO", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function wa(txt) { return WA ? "https://wa.me/" + WA + "?text=" + encodeURIComponent(txt || "Hola CONTAX, necesito ayuda con mi pago.") : "#"; }
  function api(datos) {
    if (!URL_) return Promise.resolve({ ok: false, error: "La pasarela aún no está activada. Escríbenos por WhatsApp." });
    return fetch(URL_, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(datos) })
      .then(function (r) { return r.json(); })
      .catch(function () { return { ok: false, error: "No hay conexión. Revisa tu internet e intenta de nuevo." }; });
  }
  function barras() {
    var orden = { nit: 0, datos: 1, servicio: 1, opcion: 2, pago: 3, verif: 4, fin: 4 }, k = orden[S.paso] || 0;
    document.querySelectorAll("#barras i").forEach(function (b, i) { b.classList.toggle("on", i <= k); });
  }
  function ir(p) { S.paso = p; S.error = ""; pintar(); window.scrollTo(0, 0); }
  function cargando(txt) { main.innerHTML = '<div class="pila" style="padding-top:60px;text-align:center"><div class="spin"></div><p class="suave">' + esc(txt) + "</p></div>"; }
  function errHtml() { return S.error ? '<div class="aviso err" role="alert">' + esc(S.error) + "</div>" : ""; }

  function pintar() {
    barras();
    var h = "";
    if (S.paso === "nit") {
      h = '<div class="pila"><div class="hero"><img src="marca/clasicos/pitagoras-celular.jpg" alt="Pitágoras, de Los clásicos de los números, usando un celular"><span>Paga desde donde estés</span></div><div><p class="c13 suave" style="margin-bottom:4px">CONTAX · Contabilidad e Impuestos</p><h1>Paga tu servicio en un minuto</h1>' +
        '<p class="suave" style="margin-top:10px;font-size:15px;line-height:22px">Escribe tu NIT, elige el servicio, paga con QR y sube tu comprobante. Tu trámite queda recepcionado al instante.</p></div>' +
        '<form class="card pila" id="fNit" novalidate><div><label class="l" for="nit">Tu NIT</label><input class="nit" id="nit" inputmode="numeric" autocomplete="off" value="' + esc(S.nit) + '" placeholder="Ej. 5412313012"></div>' +
        '<p class="chico suave">Con tu NIT completamos tus datos. No necesitas registrarte.</p>' + errHtml() + '<button class="btn" type="submit">Continuar</button></form></div>';
    } else if (S.paso === "datos") {
      var c = S.cli;
      var pn = String((c.nombre || "").trim().split(/\s+/).slice(-1)[0] || ""); pn = pn.charAt(0).toUpperCase() + pn.slice(1).toLowerCase();
      h = '<div class="pila"><h2>Hola' + (pn ? ", " + esc(pn) : "") + '</h2><p class="suave">Encontramos tus datos. Revisa que sean correctos.</p>' +
        '<div class="card"><div class="fila"><span>Nombre</span><b>' + esc(c.nombre) + '</b></div><div class="fila"><span>NIT</span><b>' + esc(c.nit) + "</b></div>" +
        (c.id ? '<div class="fila"><span>Código de cliente</span><b>' + esc(c.id) + "</b></div>" : "") +
        (c.celular ? '<div class="fila"><span>Celular</span><b>' + esc(c.celular) + "</b></div>" : "") +
        '<div class="fila"><span>Correo</span><b>' + (c.correo ? esc(c.correo) : '<span style="color:#93370D">Sin correo</span>') + "</b></div>" +
        (c.brinda ? '<div class="fila"><span>Plataforma</span><b>' + esc(c.brinda) + "</b></div>" : "") +
        (c.diaVence ? '<div class="fila"><span>Tu declaración vence</span><b>el día ' + esc(c.diaVence) + " de cada mes</b></div>" : "") + "</div>" +
        '<p class="chico suave">Por tu seguridad mostramos tu celular y correo ocultos.' + (c.tieneCorreo ? "" : " Como no tienes correo registrado, tu Orden de Recepción te la enviaremos por WhatsApp.") + "</p>" +
        '<button class="btn" id="bSi">Sí, soy yo · Elegir servicio</button><button class="btn2" id="bNo">No soy yo, cambiar NIT</button></div>';
    } else if (S.paso === "servicio") {
      var p = S.cfg.precios, e = S.cfg.eeff, ven = S.cfg.ventana || { abierta: true }, rep_ = !S.cli || S.cli.repartidor !== false;
      var eeffTxt = rep_ ? (e.agotado ? "cupos agotados" : "por cupos · hoy Bs " + esc(e.actual.precio)) : "Bs " + esc(p.eeffOtros);
      h = '<div class="pila"><h2>¿Qué quieres pagar?</h2>' +
        '<button class="opc" data-s="decl"' + (ven.abierta ? "" : " disabled") + '><span class="ic">' + ICON.decl + '</span><span class="t"><b>Declaración mensual</b><span>' + (ven.abierta ? "IVA e IT del mes · desde Bs " + esc(p.sinMov) : "Recepción cerrada · abre el " + esc(ven.abreDia) + " de " + esc(ven.abreMes)) + "</span></span></button>" +
        info("¿En qué consiste la declaración mensual?", INFO.decl) +
        '<button class="opc" data-s="eeff"' + (rep_ && e.agotado ? " disabled" : "") + '><span class="ic">' + ICON.eeff + '</span><span class="t"><b>Estados financieros (Balance)</b><span>Gestión ' + esc(e.gestion) + " · " + eeffTxt + "</span></span></button>" +
        info("¿En qué consisten los estados financieros?", INFO.eeff) +
        '<button class="opc" data-s="fact"><span class="ic">' + ICON.fact + '</span><span class="t"><b>Suscripción de facturación</b><span>Emisión de tus facturas del mes · Bs ' + esc(p.fact) + "</span></span></button>" +
        info("¿En qué consiste la suscripción de facturación?", INFO.fact) +
        '<button class="link" id="bVolver">Volver</button></div>';
    } else if (S.paso === "opcion" && S.serv === "decl") {
      var pr = S.cfg.precios, ven2 = S.cfg.ventana || {}, enF = ven2.tipo === "enFecha", esRep = !S.cli || S.cli.repartidor !== false;
      var planes = [["basico", "Básico", "Sin movimiento: no compraste ni vendiste con factura", pr.sinMov]];
      if (esRep) planes.push(["estandar", "Estándar", "Con facturas · hasta 100 al mes", enF ? pr.enFecha : pr.fueraFecha]);
      planes.push(["premium", "Premium", esRep ? "Con facturas · de 101 a 200 al mes" : "Empresas unipersonales · hasta 200 facturas al mes", pr.premium]);
      h = '<div class="pila"><h2>Declaración mensual</h2><div><label class="l" for="selPer">Mes a declarar</label><select id="selPer">' +
        S.cfg.periodosDecl.map(function (x, i) { return '<option value="' + i + '"' + (S.per && x.anio === S.per.anio && x.mes === S.per.mes ? " selected" : "") + ">" + esc(x.texto) + (i ? " (atrasado)" : "") + "</option>"; }).join("") + "</select>" +
        '<p class="chico suave" style="margin-top:6px">Cada pago cubre un mes. Si debes varios, paga uno por uno.</p></div>' +
        '<p class="l" style="margin:4px 0 0">Elige tu plan</p>' +
        planes.map(function (o) { return '<button class="opc' + (S.plan === o[0] ? " sel" : "") + '" data-plan="' + o[0] + '"><span class="t"><b>' + o[1] + (o[0] === "estandar" ? '<span class="etq">Repartidores</span>' : "") + "</b><span>" + o[2] + '</span></span><span class="precio">Bs ' + esc(o[3]) + "</span></button>"; }).join("") +
        '<a class="chico" href="' + wa("Hola CONTAX, tengo más de 200 facturas al mes y quiero el Plan Personalizado.") + '" target="_blank" rel="noopener" style="text-align:center">¿Más de 200 facturas al mes? Pide el Plan Personalizado por WhatsApp</a>' +
        (S.plan && S.plan !== "basico" ? '<p class="l" style="margin:4px 0 0">¿Qué facturas tuviste?</p><div class="tipos">' +
          [["elec", "Electrónicas"], ["man", "Manuales"], ["mix", "Ambas"]].map(function (t) { return '<button data-tf="' + t[0] + '" class="' + (S.tipoFact === t[0] ? "sel" : "") + '">' + t[1] + "</button>"; }).join("") + "</div>" +
          (S.tipoFact === "man" || S.tipoFact === "mix" ? '<div class="aviso ok">Deja tus facturas manuales en nuestro <b>buzón de la Av. Alemana, 7mo anillo</b> (abierto a toda hora).</div>' : "") : "") +
        avisoFecha() + info("Ver todos los planes", INFO.planes) + errHtml() +
        '<button class="btn" id="bPagar"' + (S.cot && S.cot.ok ? "" : " disabled") + ">" + (S.cot && S.cot.ok ? "Pagar " + bs(S.cot.monto) : "Elige tu plan") + '</button><button class="link" id="bVolver">Volver</button></div>';
    } else if (S.paso === "opcion" && S.serv === "eeff") {
      var E = S.cfg.eeff;
      var esRepE = !S.cli || S.cli.repartidor !== false;
      if (!esRepE) {
        h = '<div class="pila"><h2>Estados financieros</h2><div class="card"><div class="fila"><span>Gestión</span><b>' + esc(E.gestion) + '</b></div><div class="fila" style="border-top:1px solid #DAF1DE;margin-top:6px;padding-top:12px"><span>Total</span><b class="precio" style="font-size:26px">' + (S.cot && S.cot.ok ? bs(S.cot.monto) : "…") + "</b></div></div>" +
          info("¿Qué incluye?", INFO.eeff, true) + errHtml() +
          '<button class="btn" id="bPagar"' + (S.cot && S.cot.ok ? "" : " disabled") + ">Pagar " + (S.cot && S.cot.ok ? bs(S.cot.monto) : "") + '</button><button class="link" id="bVolver">Volver</button></div>';
      } else
      h = '<div class="pila"><h2>Estados financieros</h2><div class="card"><div class="fila"><span>Gestión</span><b>' + esc(E.gestion) + "</b></div></div>" +
        '<p class="l" style="margin:4px 0 0">Precio según cupo</p>' +
        E.cupos.map(function (c) { var act = E.actual && c.n === E.actual.n, lleno = c.libres <= 0;
          return '<div class="cupo' + (act ? " act" : "") + (lleno ? " lleno" : "") + '"><div style="display:flex;justify-content:space-between;align-items:center"><span><b>Cupo ' + c.n + '</b> <span class="chico" style="font-weight:700;margin-left:6px;color:' + (lleno ? "#B42318" : act ? "#235347" : "#557363") + '">' + (lleno ? "LLENO" : act ? "DISPONIBLE" : "SIGUIENTE") + '</span></span><span class="precio" style="color:' + (act ? "#163832" : "#557363") + '">Bs ' + esc(c.precio) + '</span></div><div class="barra"><i style="width:' + (c.capacidad ? Math.round(c.ocupados / c.capacidad * 100) : 0) + '%"></i></div><p class="chico suave">' + (lleno ? c.capacidad + " de " + c.capacidad + " cupos ocupados" : act ? "Quedan " + c.libres + " de " + c.capacidad + " · tu precio actual" : "Se habilita cuando se llene el cupo anterior") + "</p></div>"; }).join("") +
        '<p class="chico suave">Cuando se llena un cupo, el precio pasa automáticamente al siguiente. ¡Aprovecha temprano y paga menos!</p>' + info("¿Qué incluye?", INFO.eeff) + errHtml() +
        '<button class="btn" id="bPagar"' + (S.cot && S.cot.ok ? "" : " disabled") + ">" + (S.cot && S.cot.ok ? "Reservar mi cupo · Pagar " + bs(S.cot.monto) : "Calculando…") + '</button><button class="link" id="bVolver">Volver</button></div>';
    } else if (S.paso === "opcion" && S.serv === "fact") {
      h = '<div class="pila"><h2>Suscripción de facturación</h2><div class="card"><div class="fila"><span>Mes</span><b>' + esc(S.cfg.periodoFact.texto) + '</b></div><div class="fila"><span>Incluye</span><b>Emisión de tus facturas durante todo el mes</b></div>' +
        '<div class="fila" style="border-top:1px solid #DAF1DE;margin-top:6px;padding-top:12px"><span>Total</span><b class="precio" style="font-size:26px">' + (S.cot && S.cot.ok ? bs(S.cot.monto) : "…") + "</b></div></div>" + info("¿Qué incluye?", INFO.fact, true) + errHtml() +
        '<button class="btn" id="bPagar"' + (S.cot && S.cot.ok ? "" : " disabled") + ">Pagar " + (S.cot && S.cot.ok ? bs(S.cot.monto) : "") + '</button><button class="link" id="bVolver">Volver</button></div>';
    } else if (S.paso === "pago") {
      var q = S.cot;
      h = '<div class="pila"><h2>Paga con QR</h2><div class="card pila" style="align-items:center;text-align:center"><p class="c13 suave">' + esc(q.resumen) + '</p><div class="monto">' + bs(q.monto) + "</div>" +
        (q.qr ? '<img class="qr" src="' + esc(q.qr) + '" alt="Código QR para pagar ' + bs(q.monto) + '"><p class="chico suave">A nombre de CONTAX · El QR ya trae el monto exacto</p><a class="btn2" style="display:flex;align-items:center;justify-content:center;text-decoration:none;width:auto;padding:0 18px" href="' + esc(q.qr) + '" download="QR-CONTAX-' + esc(q.monto) + '.png">Descargar QR</a>'
              : '<div class="aviso warn">El QR de este monto no está disponible en este momento. <a href="' + wa("Hola, quiero pagar " + q.resumen + " (" + bs(q.monto) + ") y no me aparece el QR.") + '" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>.</div>') +
        '</div><div class="pila" style="gap:8px"><div class="paso"><b>1</b>Escanea el QR desde la app de tu banco.</div><div class="paso"><b>2</b>Paga el monto exacto y guarda la captura del comprobante.</div><div class="paso"><b>3</b>Súbela aquí para recepcionar tu servicio.</div></div>' +
        (S.img ? '<img class="prev" src="' + S.img + '" alt="Comprobante subido">' : "") + errHtml() +
        '<label class="subir" for="fComp">' + ICON.subir + (S.img ? "Cambiar comprobante" : "Subir comprobante") + '</label><input type="file" id="fComp" accept="image/*" class="oculto">' +
        (S.img ? '<button class="btn" id="bVerif">Verificar comprobante</button>' : "") + '<button class="link" id="bVolver">Cambiar servicio</button></div>';
    } else if (S.paso === "verif") {
      var v = S.ver;
      h = '<div class="pila"><h2>' + (v.aprobado ? "Comprobante verificado" : "Revisemos tu comprobante") + '</h2><p class="suave c13">Esto es lo que leímos en la captura que subiste:</p><div class="card" style="padding:4px 18px">' +
        v.checks.map(function (k) { return '<div class="chk"><span class="d ' + (k.ok ? "ok" : "no") + '">' + (k.ok ? ICON.ok : ICON.no) + '</span><span class="v"><span>' + esc(k.label) + "</span><b>" + esc(k.valor) + '</b></span><span class="n" style="color:' + (k.ok ? "#235347" : "#B42318") + '">' + esc(k.nota) + "</span></div>"; }).join("") + "</div>" +
        (v.aprobado ? '<button class="btn" id="bConf">Confirmar y recepcionar</button>'
          : '<div class="aviso warn">Algo no coincide (' + esc(v.motivos.join(", ")) + '). Puedes subir otra captura más clara, o enviarlo así: el equipo de CONTAX lo revisará y te escribirá por WhatsApp.</div><button class="btn" id="bOtra">Subir otra captura</button><button class="btn2" id="bConf">Enviar a revisión</button>') + errHtml() + "</div>";
    } else if (S.paso === "fin") {
      var f = S.fin, ok = f.estado === "aprobado";
      h = '<div class="pila" style="text-align:center;padding-top:16px"><div class="check' + (ok ? "" : " rev") + '">' + (ok ? ICON.big : ICON.reloj) + "</div>" +
        "<h2>" + (ok ? "¡Listo!" : "Pago en revisión") + '</h2><p class="suave" style="line-height:22px">' + (ok ? "Tu pago fue recepcionado." : "Recibimos tu comprobante. Lo revisaremos y te escribiremos por WhatsApp.") + "<br>Orden de Recepción <b style=\"color:#163832\">N° " + esc(f.nroRecepcion) + "</b></p>" +
        '<div class="card" style="text-align:left"><div class="fila"><span>Servicio</span><b>' + esc(f.resumen) + '</b></div><div class="fila"><span>Importe</span><b>' + bs(f.monto) + "</b></div>" +
        (ok && f.correoEnviado ? '<div class="fila"><span>Enviado a</span><b>' + esc(f.correo) + "</b></div>" : "") + "</div>" +
        '<p class="c13 suave" style="line-height:19px">' + (ok ? "El equipo de CONTAX ya tiene tu trámite en su lista de trabajo. Te avisaremos por WhatsApp cuando esté listo." : "Guarda este número por si necesitas consultarnos.") + "</p>" +
        '<button class="btn2" id="bOtro">Hacer otro pago</button></div>';
    }
    main.innerHTML = h;
    enlazar();
  }
  function avisoFecha() {
    if (S.plan !== "estandar") return "";
    var pr = S.cfg.precios, ven = S.cfg.ventana || {};
    if (ven.tipo === "enFecha") return '<div class="aviso ok"><b>Estás en fecha: Bs ' + esc(pr.enFecha) + "</b><br>Pagando del " + S.cfg.diaDesde + " a fin de mes tienes el precio normal.</div>";
    return '<div class="aviso warn"><b>Recepción tardía: Bs ' + esc(pr.fueraFecha) + "</b><br>El precio normal (Bs " + esc(pr.enFecha) + ") es pagando del " + S.cfg.diaDesde + " al 30. La recepción cierra el día " + esc(S.cfg.diaCierre || 5) + ".</div>";
  }
  function cotizar() {
    S.cot = null; pintar();
    var d = { action: "pas_cotizar", nit: S.nit, servicio: S.serv, plan: S.plan, tipoFact: S.tipoFact };
    if (S.serv === "decl") { if (!S.plan || (S.plan !== "basico" && !S.tipoFact)) { pintar(); return; } d.anio = S.per.anio; d.mes = S.per.mes; }
    api(d).then(function (r) { S.cot = r; S.error = r.ok ? "" : r.error; pintar(); });
  }
  function comprimir(file) {
    return new Promise(function (res, rej) {
      if (!/^image\//.test(file.type)) return rej(new Error("Sube una imagen (foto o captura)."));
      var fr = new FileReader();
      fr.onload = function () {
        var im = new Image();
        im.onload = function () {
          var max = 1600, w = im.width, h = im.height, k = Math.min(1, max / Math.max(w, h));
          var cv = document.createElement("canvas"); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
          cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
          res(cv.toDataURL("image/jpeg", 0.85));
        };
        im.onerror = function () { rej(new Error("No se pudo abrir la imagen.")); };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function enlazar() {
    var $ = function (id) { return document.getElementById(id); };
    if ($("fNit")) $("fNit").onsubmit = function (ev) {
      ev.preventDefault();
      S.nit = $("nit").value.replace(/\D/g, "");
      if (S.nit.length < 5) { S.error = "Escribe tu NIT completo."; pintar(); return; }
      cargando("Buscando tus datos…");
      Promise.all([api({ action: "pas_buscar", nit: S.nit }), S.cfg ? Promise.resolve(S.cfg) : api({ action: "pas_config" })]).then(function (rs) {
        if (!rs[0].ok) { S.error = rs[0].error; ir("nit"); return; }
        if (!rs[1].ok) { S.error = rs[1].error; ir("nit"); return; }
        S.cli = rs[0].cliente; S.cfg = rs[1]; ir("datos");
      });
    };
    if ($("bSi")) $("bSi").onclick = function () { ir("servicio"); };
    if ($("bNo")) $("bNo").onclick = function () { S.cli = null; ir("nit"); };
    document.querySelectorAll("[data-s]").forEach(function (b) { b.onclick = function () {
      S.serv = b.dataset.s; S.opcion = ""; S.plan = ""; S.tipoFact = ""; S.cot = null; S.per = S.cfg.periodoDeclDefault; S.img = ""; ir("opcion");
      if (S.serv !== "decl") cotizar();
    }; });
    document.querySelectorAll("[data-plan]").forEach(function (b) { b.onclick = function () { S.plan = b.dataset.plan; if (S.plan === "basico") S.tipoFact = ""; cotizar(); }; });
    document.querySelectorAll("[data-tf]").forEach(function (b) { b.onclick = function () { S.tipoFact = b.dataset.tf; cotizar(); }; });
    if ($("selPer")) $("selPer").onchange = function () { S.per = S.cfg.periodosDecl[Number(this.value)]; if (S.plan) cotizar(); else pintar(); };
    if ($("bPagar")) $("bPagar").onclick = function () { if (S.cot && S.cot.ok) ir("pago"); };
    if ($("bVolver")) $("bVolver").onclick = function () { ir(S.paso === "servicio" ? "datos" : "servicio"); };
    if ($("fComp")) $("fComp").onchange = function () {
      var f = this.files && this.files[0]; if (!f) return;
      comprimir(f).then(function (d) { S.img = d; S.error = ""; pintar(); }).catch(function (e) { S.error = e.message; pintar(); });
    };
    if ($("bVerif")) $("bVerif").onclick = function () {
      cargando("Leyendo tu comprobante con IA… (unos segundos)");
      var d = { action: "pas_verificar", nit: S.nit, servicio: S.serv, plan: S.plan, tipoFact: S.tipoFact, imagen: S.img };
      if (S.serv === "decl") { d.anio = S.per.anio; d.mes = S.per.mes; }
      api(d).then(function (r) { if (!r.ok) { S.error = r.error; ir("pago"); return; } S.ver = r; ir("verif"); });
    };
    if ($("bOtra")) $("bOtra").onclick = function () { S.img = ""; ir("pago"); };
    if ($("bConf")) $("bConf").onclick = function () {
      this.disabled = true; cargando("Registrando tu recepción…");
      api({ action: "pas_confirmar", token: S.ver.token }).then(function (r) { if (!r.ok) { S.error = r.error; ir("verif"); return; } S.fin = r; ir("fin"); });
    };
    if ($("bOtro")) $("bOtro").onclick = function () { S.serv = ""; S.opcion = ""; S.plan = ""; S.tipoFact = ""; S.cot = null; S.img = ""; S.ver = null; S.fin = null; ir("servicio"); };
  }
  // NIT por enlace: pagos.html?nit=123456
  try { var qn = new URLSearchParams(location.search).get("nit"); if (qn) S.nit = qn.replace(/\D/g, ""); } catch (e) {}
  pintar();
})();
</script>
</body>
