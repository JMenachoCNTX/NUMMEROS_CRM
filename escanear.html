<!DOCTYPE html>
<!-- ============================================================ -->
<!--  NUMMEROS by CONTAX — Escanear facturas con el celular        -->
<!--  Se abre con el QR de Declaraciones (Panel). Saca fotos a las -->
<!--  facturas y las manda a la sesión; la computadora las lee con -->
<!--  la IA y arma el Excel del Registro de Compras.               -->
<!-- ============================================================ -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Escanear facturas · NUMMEROS</title>
<link rel="icon" href="marca/iconos/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Arimo:wght@700&display=swap">
<style>
:root{--bg:#F3F8F4;--panel:#fff;--panel2:#EEF4F0;--line:#E2ECE5;--txt:#0E2A24;--muted:#5E7A70;--accent:#235347;--ink:#fff;--tint:#DAF1DE;--ok:#2E7D5B;--danger:#B4453C;--warn:#9A7B3F}
@media (prefers-color-scheme: dark){:root{--bg:#051F20;--panel:#0B2B26;--panel2:#163832;--line:#235347;--txt:#EAF3EE;--muted:#8FB0A6;--accent:#8EB69B;--ink:#051F20;--tint:#163832;--ok:#7FC79B;--danger:#E0786F;--warn:#D7B46A}}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
header{background:#DAF1DE;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #8EB69B}
header img{height:28px}
header .t{font-family:Arimo,sans-serif;font-weight:700;color:#235347;font-size:15px;margin-left:auto}
main{padding:14px 16px;max-width:560px;margin:0 auto}
.cli{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.cli b{display:block;font-size:16px}
.cli span{color:var(--muted);font-size:13px}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .guia{position:absolute;inset:7% 8%;border:2px dashed rgba(218,241,222,.8);border-radius:10px;pointer-events:none}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.cam .msgcam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#DAF1DE;text-align:center;padding:24px;font-size:14px;line-height:1.5}
.cam.sincam{aspect-ratio:auto;height:150px}.cam.sincam video,.cam.sincam .guia{display:none}
.btns{display:flex;gap:10px;margin:12px 0;align-items:center;justify-content:center}
.disparo{width:76px;height:76px;border-radius:50%;border:5px solid var(--accent);background:var(--panel);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 40px var(--accent);cursor:pointer}
.disparo:active{transform:scale(.94)}
.sec{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.cont{text-align:center;color:var(--muted);font-size:13px;margin:-4px 0 10px}
.tips{font-size:13px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:9px 12px;margin:0 0 12px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
li img{width:46px;height:58px;object-fit:cover;border-radius:6px;background:var(--panel2);flex:0 0 46px}
li .d{flex:1;min-width:0;font-size:13px}
li .d b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.est{font-size:12px;font-weight:700}
.est.ok{color:var(--ok)} .est.err{color:var(--danger)} .est.esp{color:var(--warn)}
.err-box{background:var(--panel);border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:16px;text-align:center}
h3{font-size:14px;margin:16px 0 8px}
</style>
</head>
<body>
<header><img src="marca/logos/nummeros-logotipo-firma-principal.svg" alt="NUMMEROS"><span class="t">Escanear facturas</span></header>
<main id="app"><p class="cont">Cargando…</p></main>
<script src="config.js?v=82"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const db = getFirestore(initializeApp(window.APP_CONFIG.firebase));
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const sid = (new URLSearchParams(location.search).get("s") || "").replace(/[^A-Za-z0-9_-]/g, "");
const app = $("app");
const fallo = t => { app.innerHTML = `<div class="err-box">${t}</div>`; };
let enviadas = 0, pendientes = 0, stream = null;

// Achica la foto: lado mayor 1600 px en JPEG y baja la calidad hasta que entre en Firestore (máx. ~900 KB)
function achicar(fuente, w, h, lado, max) {
  const k = Math.min(1, lado / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(fuente, 0, 0, c.width, c.height);
  let q = 0.82, url = c.toDataURL("image/jpeg", q);
  while (url.length > max && q > 0.35) { q -= 0.1; url = c.toDataURL("image/jpeg", q); }
  return url;
}
const idNuevo = () => Date.now().toString(36) + "-" + Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, "0")).join("");

async function enviar(fuente, w, h) {
  const img = achicar(fuente, w, h, 1600, 900000), mini = achicar(fuente, w, h, 240, 60000);
  const fid = idNuevo();
  pendientes++; pintarContador();
  try {
    // Primero la foto grande, después la ficha (así la compu ya encuentra la foto cuando ve la ficha)
    await setDoc(doc(db, "escaneos", sid, "img", fid), { img, creado: serverTimestamp() });
    await setDoc(doc(db, "escaneos", sid, "fotos", fid), { estado: "nueva", mini, origen: "celular", creado: serverTimestamp() });
    enviadas++;
  } catch (e) {
    alert("No se pudo enviar la foto. Revisa tu internet y vuelve a sacarla.\n(" + (e.code || e.message) + ")");
  } finally { pendientes--; pintarContador(); }
}
function pintarContador() {
  const c = $("cont"); if (c) c.textContent = pendientes ? `Enviando ${pendientes} foto(s)…` : enviadas ? `✓ ${enviadas} foto(s) enviadas en esta visita` : "Toca el botón para sacar la foto";
}
async function encenderCamara() {
  const v = $("video");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 2560 }, height: { ideal: 1920 } }, audio: false });
    v.srcObject = stream; await v.play();
    $("msgcam").style.display = "none";
  } catch (e) {
    $("msgcam").innerHTML = "<div>No pudimos abrir la cámara aquí.<br>Usa el botón <b>«📷 Abrir cámara»</b> de abajo.</div>";
    $("disparo").style.display = "none";
    document.querySelector(".cam").classList.add("sincam");
  }
}
function disparar() {
  const v = $("video"); if (!v.videoWidth) return;
  const f = $("flash"); f.style.opacity = ".8"; setTimeout(() => f.style.opacity = "0", 150);
  if (navigator.vibrate) navigator.vibrate(40);
  enviar(v, v.videoWidth, v.videoHeight);
}
async function desdeArchivos(files) {
  for (const file of files) {
    if (!/^image\//.test(file.type)) continue;
    const url = URL.createObjectURL(file);
    try {
      const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("imagen")); i.src = url; });
      await enviar(im, im.naturalWidth, im.naturalHeight);
    } catch (e) { alert("No se pudo abrir " + file.name); }
    URL.revokeObjectURL(url);
  }
}
function escucharLista() {
  onSnapshot(query(collection(db, "escaneos", sid, "fotos"), orderBy("creado", "desc")), snap => {
    const t = $("lista"); if (!t) return;
    $("total").textContent = snap.size ? `(${snap.size})` : "";
    t.innerHTML = snap.docs.map(d => {
      const x = d.data(), dt = x.datos || {};
      const est = x.estado === "lista" ? `<span class="est ok">✓ Leída</span>` : x.estado === "error" ? `<span class="est err">✕ ${esc(x.error || "No se pudo leer")}</span>` :
        x.estado === "no_factura" ? `<span class="est err">✕ No parece una factura</span>` : x.estado === "leyendo" ? `<span class="est esp">🤖 Leyendo…</span>` : `<span class="est esp">⏳ En espera (la computadora la leerá)</span>`;
      const tit = dt.razonSocial ? esc(dt.razonSocial) : x.origen === "celular" ? "Factura" : "Factura (desde la compu)";
      return `<li>${x.mini ? `<img src="${x.mini}" alt="">` : `<img alt="">`}<div class="d"><b>${tit}</b>${dt.importeTotal ? "Bs " + esc(dt.importeTotal) + " · " : ""}${dt.numeroFactura ? "N.º " + esc(dt.numeroFactura) + " · " : ""}${est}</div></li>`;
    }).join("") || `<p class="cont">Todavía no hay fotos.</p>`;
  }, e => { const t = $("lista"); if (t) t.innerHTML = `<p class="cont">No se puede ver la lista (${esc(e.code || e.message)}).</p>`; });
}

(async () => {
  if (!sid || sid.length < 20) return fallo("Este enlace no es válido.<br>Vuelve a escanear el código QR desde el Panel.");
  let s;
  try { s = await getDoc(doc(db, "escaneos", sid)); }
  catch (e) { return fallo("No se pudo abrir la sesión (" + esc(e.code || e.message) + ").<br>Revisa tu internet."); }
  if (!s.exists()) return fallo("Esta sesión ya no existe.<br>Vuelve a escanear el código QR desde el Panel.");
  const S = s.data();
  const vence = S.vence && S.vence.toDate ? S.vence.toDate() : null;
  if (vence && vence < new Date()) return fallo("Esta sesión ya venció.<br>En el Panel abre otra vez «Escanear facturas con el celular» y escanea el nuevo QR.");
  app.innerHTML = `
    <div class="cli"><b>${esc(S.cliente || "Cliente")}</b><span>NIT ${esc(S.nit || "—")} · Período ${esc(S.periodoTxt || S.periodo || "—")}</span></div>
    <div class="tips">📄 Pon la factura sobre una mesa, con buena luz, que se vea <b>entera</b> y sin sombras. Saca <b>una foto por factura</b>.</div>
    <div class="cam"><video id="video" playsinline muted></video><div class="guia"></div><div class="flash" id="flash"></div><div class="msgcam" id="msgcam">Abriendo la cámara…</div></div>
    <div class="btns"><button class="disparo" id="disparo" aria-label="Sacar foto"></button></div>
    <p class="cont" id="cont"></p>
    <div class="btns">
      <label class="sec">📷 Abrir cámara<input type="file" accept="image/*" capture="environment" id="fcam" hidden></label>
      <label class="sec">🖼 Elegir de la galería<input type="file" accept="image/*" multiple id="fgal" hidden></label>
    </div>
    <h3>Facturas de esta sesión <span id="total"></span></h3>
    <ul id="lista"></ul>`;
  $("disparo").onclick = disparar;
  $("fcam").onchange = e => { desdeArchivos([...e.target.files]); e.target.value = ""; };
  $("fgal").onchange = e => { desdeArchivos([...e.target.files]); e.target.value = ""; };
  pintarContador();
  encenderCamara();
  escucharLista();
  // Si el celular apaga la pantalla, al volver se enciende la cámara otra vez
  document.addEventListener("visibilitychange", () => { if (!document.hidden && stream && !stream.active) encenderCamara(); });
})();
</script>
</body>
</html>
